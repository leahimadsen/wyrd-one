<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="darkreader-lock">
<meta name="robots" content="noindex, nofollow">
<title>{{WHO}} · {{TITLE}}</title>
<style>
@import url('/static/fonts/texturina.css');
:root{--void:#05080a;--ivory:#d9d4c4;--dim:rgba(217,212,196,.55);--celadon:#9cb4a6;--jade:#5f9c86;--gold:#b8924a;--rule:rgba(156,180,166,.14);
  --serif:'Texturina','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--ivory);font-family:var(--serif);font-size:17px;line-height:1.72}
.wrap{width:min(760px,100% - 36px);margin:0 auto;padding:60px 0 80px}
.preview{background:#5a3b16;color:#fff;text-align:center;padding:8px;font-size:14px}
.preview:empty{display:none}
.preview a{color:#ffd9a0}
header h1{font-weight:300;font-size:clamp(38px,8vw,58px);line-height:1.05;margin:0 0 10px;color:#e6e1f4}
header .born{color:var(--dim);margin:0 0 30px}
.opening,.closing{font-style:italic;color:rgba(217,212,196,.85);font-size:18px}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 10px}
.next{border:1px solid var(--gold);border-left:3px solid var(--gold);padding:14px 18px;margin:18px 0 6px;font-size:16px}
.next p{margin:0 0 8px}.next .next-h{color:var(--gold);font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.next .next-go{margin:12px 0 2px}.next .next-go a{display:inline-block;color:var(--ivory);border:1px solid var(--jade);padding:8px 14px;border-radius:2px;text-decoration:none}
.next .next-go a:hover{background:rgba(255,255,255,.05)}
.tools button{font:inherit;font-size:15px;color:var(--ivory);background:none;border:1px solid var(--jade);padding:8px 14px;border-radius:2px;cursor:pointer}
.rd-sec{padding:54px 0 10px;border-top:1px solid var(--rule);margin-top:40px;break-before:page}
.rd-num{color:var(--gold);font-size:15px;letter-spacing:.08em}
.rd-sec h2{font-weight:400;font-size:34px;margin:2px 0 4px;color:var(--celadon)}
.rd-sub{color:var(--dim);margin-bottom:26px}
.rd-sec h3{font-weight:400;font-size:21px;margin:30px 0 8px}
.rd-pair{display:grid;grid-template-columns:minmax(0,12em) 1fr;gap:16px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:16px}
.rd-pair em{color:var(--dim);font-style:normal}
.sw{display:inline-block;width:.8em;height:.8em;margin-right:.45em;vertical-align:-.05em;border-radius:1px}
.rd-kenning{color:rgba(217,212,196,.78);font-style:italic}
.rd-toc{margin:34px 0 10px;padding:18px 22px;border:1px solid var(--rule);border-radius:6px}
.rd-toc h2{font-weight:400;font-size:20px;margin:0 0 8px;color:var(--gold);letter-spacing:.04em}
.rd-toc ol{list-style:none;margin:0;padding:0;columns:2 240px;column-gap:28px}
.rd-toc li{break-inside:avoid;margin:3px 0}
.rd-toc a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
.rd-toc a:hover,.rd-toc a:focus{border-bottom-color:var(--gold)}
.rd-toc span{display:inline-block;min-width:2.6em;color:var(--gold)}
.rd-totop{position:fixed;right:14px;bottom:14px;z-index:5;padding:8px 14px;border:1px solid var(--rule);border-radius:20px;background:rgba(8,8,18,.92);color:var(--gold);font-size:14px;text-decoration:none}
.rd-sec{scroll-margin-top:16px}
.rd-story{break-before:auto}.rd-story>p:first-of-type::first-letter{float:left;font-size:3.4em;line-height:.9;margin:4px 8px 0 0;color:var(--gold)}
.rd-note{color:var(--dim);font-size:14.5px}
.rd-body h5,.rd-gifts h5,.rd-repair h5{font-weight:400;font-size:15px;color:var(--gold);margin:18px 0 2px;letter-spacing:.03em}
.rd-triad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.rd-triad div{border-top:1px solid var(--jade);padding-top:8px}
.rd-triad span{display:block;color:var(--dim);font-size:14px}
.rd-triad em{font-style:normal}
.rd-gifts{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.rd-gifts .light{border-left:2px solid var(--celadon);padding-left:14px}
.rd-gifts .dark{border-left:2px solid #6a5a8a;padding-left:14px}
.rd-repair{border-left:2px solid var(--gold);padding-left:14px;margin-top:10px}
.rd-ask{margin:22px 0 8px;padding:12px 16px;border-left:2px solid var(--jade);font-style:italic;color:var(--celadon);background:rgba(95,156,134,.06)}
.rd-held{margin:22px 0 8px;padding:12px 16px;border-left:2px dashed var(--dim);color:var(--dim);font-size:15px}
.rd-entry{margin:34px 0;padding-top:6px}
.rd-entry h3{color:var(--ivory)}
.rd-side{display:inline-block;font-size:13px;margin-left:8px;padding:1px 8px;border:1px solid var(--rule);color:var(--dim);vertical-align:middle}
.rd-side.d{border-color:#6a5a8a}
.rd-hdr{color:var(--dim);font-size:14.5px}
.rd-flag{display:inline-block;margin-left:8px;color:var(--gold)}
.rd-flag.gand{color:#c58a7a}
.rd-tw{overflow-x:auto;margin:16px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top;font-weight:400}
th{color:var(--dim)} tr.hi td{color:var(--jade)}
.rd-tier{color:var(--gold)!important;margin-top:40px!important}
.rd-seq h3{font-size:19px;color:var(--celadon);border-bottom:1px solid var(--rule);padding-bottom:6px}
.rd-sphere{display:grid;grid-template-columns:3.2em 1fr;gap:10px;margin:18px 0}
.rd-sn{color:var(--gold);font-size:18px}
.rd-sphere h4{font-weight:400;font-size:19px;margin:0}
.rd-sphere h4 small{color:var(--dim);font-size:13.5px;margin-left:6px}
.rd-gate{color:var(--jade);font-size:15px}
.rd-sphere p{margin:6px 0}
.rd-how{color:rgba(217,212,196,.72);font-size:15.5px}
.rd-step{display:grid;grid-template-columns:4.2em 1fr;gap:12px;margin:22px 0;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.rd-step .rd-sn{font-size:15px;padding-top:3px}
.rd-step h4{font-weight:400;font-size:20px;margin:0}.rd-step h4 small{color:var(--dim);font-size:13.5px;margin-left:6px}
.rd-opens{margin:4px 0 2px;font-size:15px;color:var(--gold)}.rd-opens.running{color:var(--jade)}.rd-opens.ahead{color:var(--dim)}
.rd-step-q{color:var(--celadon)}.rd-step-q.held{color:var(--dim);font-size:15px}
.rd-qs{padding-left:1.4em}
.rd-qs li{margin:0 0 20px}
.rd-ql{color:var(--dim);font-size:14px}
.sample-cta p{margin:.4em 0}.sample-cta a{color:var(--gold,#b8924a)}
footer{margin-top:60px;color:var(--dim);font-size:14px;border-top:1px solid var(--rule);padding-top:20px}
@media(max-width:600px){.rd-gifts,.rd-triad{grid-template-columns:1fr}.rd-pair{grid-template-columns:1fr;gap:2px}}
.bg-pair{display:flex;flex-wrap:wrap;gap:22px;margin:18px 0;justify-content:center}
.bg-fig{margin:0;flex:1 1 260px;max-width:340px;text-align:center}
.bg-fig svg{width:100%;height:auto;display:block}
.bg-fig figcaption{font-size:14px;color:var(--dim);margin-top:6px}.bg-fig figcaption b{color:var(--ivory)}
.bg-ch{stroke:rgba(156,180,166,.22);stroke-width:3;stroke-linecap:round}
.bg-birth .bg-ch.on{stroke:#c9a35a;stroke-width:4.5}.bg-dharma .bg-ch.on{stroke:#9b84f0;stroke-width:4.5}
.bg-arrow{fill:#fff4d6;stroke:rgba(0,0,0,.35);stroke-width:.6}.bg-dharma .bg-arrow{fill:#efe8ff}
.bg-birth .bg-spark{fill:#f2d48a}.bg-dharma .bg-spark{fill:#d6c9ff}
.bg-c path{fill:none;stroke:rgba(156,180,166,.6);stroke-width:1.6}
.bg-birth .bg-c.on path{fill:#c9a35a;stroke:#e6c47e}.bg-dharma .bg-c.on path{fill:#9b84f0;stroke:#c2b2ff}
.bg-c text{fill:var(--ivory);font-size:10.5px;text-anchor:middle}.bg-c.on text{fill:#14101e;font-weight:600}
.mf{margin:18px 0;break-inside:avoid}.mf svg{width:100%;max-width:640px;height:auto;display:block;margin:0 auto}
.mf image{opacity:.92}.mf-ladder{fill:none;stroke-width:4;stroke-dasharray:2 6;opacity:.9}
.mf-lead{stroke-width:1.4;opacity:.6;fill:none}.mf-dot{fill-opacity:.8;stroke:#1b1b1b;stroke-width:1.5}.mf-dot.hi{fill-opacity:.95}.mf-ring{fill:none;stroke-width:3}
.mf-name{font-family:var(--fellsc,serif);font-size:30px}.mf-pl{font-size:30px;fill:#1b1b1b}
.mf figcaption{text-align:center;font-size:14px;opacity:.8}
.rd-short{font-size:1.05em;margin:6px 0 4px}.rd-med{padding-left:14px;border-left:2px solid var(--gold)}
.dh-ways{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0 20px}.dh-ways div{padding:10px 14px;border:1px solid var(--rule)}.dh-ways b{display:block;color:var(--gold)}.dh-ways p{margin:4px 0 0;font-size:15.5px}
.dh-centre{margin:38px 0 -10px;padding:10px 0 0;border-top:2px solid var(--rule)}.dh-centre h4{margin:0;font-size:1.15em}.dh-centre h4 small{color:var(--dim);font-weight:400;margin-left:8px}.dh-centre p{color:var(--dim);margin:4px 0 0}
.dh-gate .rd-opens{margin-top:8px}
.dh-lead{font-style:italic;color:var(--dim)}.dh-halves{margin:6px 0 10px;padding-left:20px;font-size:15.5px}.rd-ask span{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-style:normal;opacity:.75}
.dh-gate .dh-do p{margin:6px 0}.dh-foot{margin-top:10px;padding:8px 0 0 14px;border-left:2px solid var(--rule);font-size:15px}.dh-foot p,.dh-foot .rd-opens{margin:3px 0}
@media(max-width:600px){.dh-ways{grid-template-columns:1fr}}
@media print{
  .rd-totop{display:none}.mf svg{max-width:5in}
  :root{--void:#fff;--ivory:#1b1b1b;--dim:#666;--celadon:#2f5f50;--jade:#2f6f5a;--gold:#8a6a2a;--rule:#ddd}
  @page{margin:.65in .7in}
  body,body.paper{font-size:10pt!important;line-height:1.4!important}.tools,.preview,.next{display:none}.wrap{width:auto;padding:0}
  header h1{font-size:30pt}.opening,.closing{font-size:11pt}
  .rd-sec{padding-top:14pt;margin-top:26pt;break-before:auto!important}.rd-num,.rd-sec h2,.rd-sub{break-after:avoid}.rd-sec h4,.dh-centre{break-after:avoid}.rd-entry h3,.rd-entry .rd-hdr{break-after:avoid}p{orphans:3;widows:3}.rd-sec h2{font-size:20pt}.rd-sec h3{font-size:13pt;margin:10pt 0 3pt!important;break-after:avoid}
  .rd-pair{font-size:9.5pt;padding:2pt 0!important;gap:10pt;break-inside:avoid}.rd-hdr,.rd-note,.rd-held{font-size:9.5pt}
  .rd-body h5,.rd-gifts h5,.rd-repair h5{font-size:10pt;margin:8pt 0 1pt}table{font-size:9pt!important}td,th{padding:2pt 4pt!important}
  .bg-sparks{display:none}.bg-ch{stroke:#e2e2e2;stroke-width:2}.bg-c path{stroke:#888}.bg-c text{fill:#222}.bg-c.on text{fill:#fff}.bg-pair{break-inside:avoid}.bg-pair{margin:6pt 0!important;padding:6pt!important}.bg-fig{flex:0 0 2.3in!important;max-width:2.3in!important}.mf svg{max-height:4.2in;width:auto!important}
  .rd-entry{margin:12pt 0}.rd-entry p,.rd-body p{margin:4pt 0}.rd-step{break-inside:avoid}
  .rd-ask{background:none}a{color:inherit}
  .rd-plate{break-inside:avoid;padding:6pt!important;margin:6pt 0!important}.rd-plate .wx-bar,.rd-plate .wx-card,.rd-plate .tz-layers,.rd-plate .tz-cap,.rd-plate .hb-ctl,.rd-plate .hb-hint,.rd-plate .hb-strip,.rd-plate .hb-read,.rd-plate .hb-intro{display:none!important}
  .rd-wheel .wx-stage{max-width:5.6in}.rd-tz{max-width:3.8in}.rd-hb .hb-stage{width:4.6in!important}
}
/* the console's own drawings, each on a night plate like the bodygraphs (static/reading-figs.js draws them) */
.rd-plate{background:#0b0322;border:4px inset #8f7ce0;padding:12px;margin:18px 0 10px;color:#eaf3ff;font-size:16px;line-height:1.55;
  --ivory:#eaf3ff;--ivory-dim:rgba(222,236,255,.72);--dim:rgba(222,236,255,.72);--celadon:#9ff3ff;--jade:#9a6bff;--gold:#ffb43a;--rule:rgba(160,140,255,.22);
  --serif:'Space Grotesk','Trebuchet MS',Verdana,sans-serif;--mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;--ease:cubic-bezier(.22,.61,.28,1);--out:cubic-bezier(.16,1,.3,1);--rune:'Noto Sans Runic','Segoe UI Historic','Segoe UI Symbol',sans-serif;
  font-family:var(--serif);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rd-plate a{color:var(--celadon)}
.rd-plate .wx-card{margin-bottom:6px}
.rd-tz{max-width:540px;margin:0 auto}
.rd-plate .tz-layers{margin:8px auto}
.rd-plate .tz-cap{text-align:center;font-size:14.5px}
.rd-plate .hb-intro,.rd-plate .hb-gather,.rd-plate .hb-credit,.rd-plate .hb-hint{font-size:14.5px}
/* the Harmonic Body's station, thread and centre styles, as static/console.css gives them on the console, kept to the figure */
.rd-hb .thread line{stroke:var(--jade);stroke-width:.8;opacity:.32}
.rd-hb .thread .cap{fill:var(--jade);opacity:.5}
.rd-hb .thread text{fill:var(--jade);font-family:var(--mono);font-size:8px; letter-spacing:.2em;opacity:.55;text-anchor:middle}
.rd-hb .station{cursor:pointer}
.rd-hb .station .halo{fill:var(--gold);opacity:0;transform-box:fill-box;transform-origin:center; transition:opacity 500ms var(--ease)}
.rd-hb .station .ring{fill:none;stroke:var(--gold);stroke-width:.85;opacity:.5;transition:all 500ms var(--ease)}
.rd-hb .station .core{fill:var(--gold);opacity:.85;transition:fill 500ms var(--ease)}
.rd-hb .station .bar{stroke:var(--gold);stroke-width:.85;opacity:.5;transition:all 500ms var(--ease)}
.rd-hb .station .lead{stroke:var(--gold);stroke-width:.55;fill:none;opacity:.24;transition:opacity 500ms var(--ease)}
.rd-hb .station .tag{fill:var(--ivory);font-family:var(--mono);font-size:8.2px;letter-spacing:.22em; text-transform:uppercase;opacity:.3;transition:all 500ms var(--ease)}
.rd-hb .station:hover .tag,.rd-hb .station:focus-visible .tag{opacity:.95}
.rd-hb .station:hover .lead{opacity:.55}
.rd-hb .station:hover .ring,.rd-hb .station:hover .bar{opacity:1}
.rd-hb .station:hover .halo,.rd-hb .station:focus-visible .halo{opacity:.13;animation:pulse 2.6s var(--ease) infinite}
.rd-hb .station.live .core,.rd-hb .station.live .ring,.rd-hb .station.live .bar{fill:var(--jade);stroke:var(--jade);opacity:1}
.rd-hb .station.live .tag{fill:var(--jade);opacity:1}
.rd-hb .station.live .lead{opacity:.5}
.rd-hb .station.live .halo{fill:var(--jade);opacity:.15;animation:pulse 3.4s var(--ease) infinite}
.rd-hb .stations.dimmed .station:not(.live){opacity:.16}
.rd-hb .stations .station{transition:opacity 700ms var(--ease)}
.rd-hb .centre .shape{fill:none;stroke-width:.9;transition:all 700ms var(--ease)}
.rd-hb .centre .lbl{font-family:var(--mono);font-size:6.6px;letter-spacing:.14em;text-transform:uppercase; text-anchor:middle;transition:all 700ms var(--ease)}
.rd-hb .centre.rave .shape{stroke:var(--gold);fill:rgba(184,146,74,.22)}
.rd-hb .centre.rave .lbl{fill:var(--gold);opacity:.9}
.rd-hb .centre.dharma .shape{stroke:var(--jade);fill:rgba(95,156,134,.2)}
.rd-hb .centre.dharma .lbl{fill:var(--jade);opacity:.9}
.rd-hb .centre.both .shape{stroke:var(--ivory);fill:rgba(217,212,196,.2);stroke-width:1.2}
.rd-hb .centre.both .lbl{fill:var(--ivory);opacity:1}
.rd-hb .centre.undefined .shape{stroke:var(--ivory);stroke-dasharray:2.5 3;opacity:.2}
.rd-hb .centre.undefined .lbl{fill:var(--ivory);opacity:.14}
@keyframes pulse{0%{transform:scale(1);opacity:.15}60%{transform:scale(2);opacity:0}100%{transform:scale(2);opacity:0}}
.rd-key{justify-content:flex-start;margin:4px 0 18px;color:var(--dim)}.rd-key i{border-color:rgba(29,23,18,.35)}
.mf-sw{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.4em;vertical-align:baseline;border:1px solid rgba(0,0,0,.4)}
</style>

<link rel="stylesheet" href="/static/map.css?v=2">
<link rel="stylesheet" href="/static/body.css?v=2">
<link rel="icon" href="/static/icons/favicon-32.png?v=2" sizes="32x32" type="image/png">

</head>
<body class="paper codex">
<div class="preview">{{PREVIEW}}</div>
<div class="wrap">
<header>
  <h1>{{WHO}}</h1>
  <p class="born">{{BORN}}</p>
  <p class="opening">{{OPENING}}</p>
  <div class="tools">
    <button onclick="window.print()">Save as PDF</button>
    <button onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href).then(()=>this.textContent='Link copied')">Copy link to this reading</button>
  </div>
  {{NEXT}}
</header>
{{BODY}}
<p class="closing">{{CLOSING}}</p>
{{FOOTER}}
</div>
<script src="/static/viz.js?v=2"></script>
<script src="/static/body.js?v=2"></script>
<script src="/static/wheel.js?v=2"></script>
<script src="/static/torus.js?v=2"></script>
<script src="/static/reading-figs.js?v=1"></script>
<script>
/* the PDF link in the delivery email: the reading opens with the save-as-PDF window, once the drawings have built */
if (new URLSearchParams(location.search).get("pdf") === "1") addEventListener("load", () => setTimeout(() => window.print(), document.querySelector("[data-fig]") ? 3200 : 600));
</script>
</body>
</html>
