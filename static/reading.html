<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{{WHO}} · {{TITLE}}</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Texturina:ital,opsz,wght@0,12..72,300;0,12..72,400;1,12..72,400&display=swap');
:root{--void:#05080a;--ivory:#d9d4c4;--dim:rgba(217,212,196,.55);--celadon:#9cb4a6;--jade:#5f9c86;--gold:#b8924a;--rule:rgba(156,180,166,.14);
  --serif:'Texturina','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--ivory);font-family:var(--serif);font-size:17px;line-height:1.72}
.wrap{width:min(760px,100% - 36px);margin:0 auto;padding:60px 0 80px}
.preview{background:#5a3b16;color:#fff;text-align:center;padding:8px;font-size:14px}
.preview:empty{display:none}
header h1{font-weight:300;font-size:clamp(38px,8vw,58px);line-height:1.05;margin:0 0 10px;color:#e6e1f4}
header .born{color:var(--dim);margin:0 0 30px}
.opening,.closing{font-style:italic;color:rgba(217,212,196,.85);font-size:18px}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 10px}
.tools button{font:inherit;font-size:15px;color:var(--ivory);background:none;border:1px solid var(--jade);padding:8px 14px;border-radius:2px;cursor:pointer}
.rd-sec{padding:54px 0 10px;border-top:1px solid var(--rule);margin-top:40px;break-before:page}
.rd-num{color:var(--gold);font-size:15px;letter-spacing:.08em}
.rd-sec h2{font-weight:400;font-size:34px;margin:2px 0 4px;color:var(--celadon)}
.rd-sub{color:var(--dim);margin-bottom:26px}
.rd-sec h3{font-weight:400;font-size:21px;margin:30px 0 8px}
.rd-pair{display:grid;grid-template-columns:minmax(0,12em) 1fr;gap:16px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:16px}
.rd-pair em{color:var(--dim);font-style:normal}
.sw{display:inline-block;width:.8em;height:.8em;margin-right:.45em;vertical-align:-.05em;border-radius:1px}
.rd-kenning{color:rgba(217,212,196,.78);font-style:italic}
.rd-toc{margin:34px 0 10px;padding:18px 22px;border:1px solid var(--rule);border-radius:6px}
.rd-toc h2{font-weight:400;font-size:20px;margin:0 0 8px;color:var(--gold);letter-spacing:.04em}
.rd-toc ol{list-style:none;margin:0;padding:0;columns:2 240px;column-gap:28px}
.rd-toc li{break-inside:avoid;margin:3px 0}
.rd-toc a{color:inherit;text-decoration:none;border-bottom:1px solid transparent}
.rd-toc a:hover,.rd-toc a:focus{border-bottom-color:var(--gold)}
.rd-toc span{display:inline-block;min-width:2.6em;color:var(--gold)}
.rd-totop{position:fixed;right:14px;bottom:14px;z-index:5;padding:8px 14px;border:1px solid var(--rule);border-radius:20px;background:rgba(8,8,18,.92);color:var(--gold);font-size:14px;text-decoration:none}
.rd-sec{scroll-margin-top:16px}
.rd-story{break-before:auto}.rd-story>p:first-of-type::first-letter{float:left;font-size:3.4em;line-height:.9;margin:4px 8px 0 0;color:var(--gold)}
.rd-note{color:var(--dim);font-size:14.5px}
.rd-body h5,.rd-gifts h5,.rd-repair h5{font-weight:400;font-size:15px;color:var(--gold);margin:18px 0 2px;letter-spacing:.03em}
.rd-triad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.rd-triad div{border-top:1px solid var(--jade);padding-top:8px}
.rd-triad span{display:block;color:var(--dim);font-size:14px}
.rd-triad em{font-style:normal}
.rd-gifts{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.rd-gifts .light{border-left:2px solid var(--celadon);padding-left:14px}
.rd-gifts .dark{border-left:2px solid #6a5a8a;padding-left:14px}
.rd-repair{border-left:2px solid var(--gold);padding-left:14px;margin-top:10px}
.rd-ask{margin:22px 0 8px;padding:12px 16px;border-left:2px solid var(--jade);font-style:italic;color:var(--celadon);background:rgba(95,156,134,.06)}
.rd-held{margin:22px 0 8px;padding:12px 16px;border-left:2px dashed var(--dim);color:var(--dim);font-size:15px}
.rd-entry{margin:34px 0;padding-top:6px}
.rd-entry h3{color:var(--ivory)}
.rd-side{display:inline-block;font-size:13px;margin-left:8px;padding:1px 8px;border:1px solid var(--rule);color:var(--dim);vertical-align:middle}
.rd-side.d{border-color:#6a5a8a}
.rd-hdr{color:var(--dim);font-size:14.5px}
.rd-flag{display:inline-block;margin-left:8px;color:var(--gold)}
.rd-flag.gand{color:#c58a7a}
.rd-tw{overflow-x:auto;margin:16px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top;font-weight:400}
th{color:var(--dim)} tr.hi td{color:var(--jade)}
.rd-tier{color:var(--gold)!important;margin-top:40px!important}
.rd-seq h3{font-size:19px;color:var(--celadon);border-bottom:1px solid var(--rule);padding-bottom:6px}
.rd-sphere{display:grid;grid-template-columns:3.2em 1fr;gap:10px;margin:18px 0}
.rd-sn{color:var(--gold);font-size:18px}
.rd-sphere h4{font-weight:400;font-size:19px;margin:0}
.rd-sphere h4 small{color:var(--dim);font-size:13.5px;margin-left:6px}
.rd-gate{color:var(--jade);font-size:15px}
.rd-sphere p{margin:6px 0}
.rd-how{color:rgba(217,212,196,.72);font-size:15.5px}
.rd-step{display:grid;grid-template-columns:4.2em 1fr;gap:12px;margin:22px 0;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.rd-step .rd-sn{font-size:15px;padding-top:3px}
.rd-step h4{font-weight:400;font-size:20px;margin:0}.rd-step h4 small{color:var(--dim);font-size:13.5px;margin-left:6px}
.rd-opens{margin:4px 0 2px;font-size:15px;color:var(--gold)}.rd-opens.running{color:var(--jade)}.rd-opens.ahead{color:var(--dim)}
.rd-step-q{color:var(--celadon)}.rd-step-q.held{color:var(--dim);font-size:15px}
.rd-qs{padding-left:1.4em}
.rd-qs li{margin:0 0 20px}
.rd-ql{color:var(--dim);font-size:14px}
.sample-cta p{margin:.4em 0}.sample-cta a{color:var(--gold,#b8924a)}
footer{margin-top:60px;color:var(--dim);font-size:14px;border-top:1px solid var(--rule);padding-top:20px}
@media(max-width:600px){.rd-gifts,.rd-triad{grid-template-columns:1fr}.rd-pair{grid-template-columns:1fr;gap:2px}}
.bg-pair{display:flex;flex-wrap:wrap;gap:22px;margin:18px 0;justify-content:center}
.bg-fig{margin:0;flex:1 1 260px;max-width:340px;text-align:center}
.bg-fig svg{width:100%;height:auto;display:block}
.bg-fig figcaption{font-size:14px;color:var(--dim);margin-top:6px}.bg-fig figcaption b{color:var(--ivory)}
.bg-ch{stroke:rgba(156,180,166,.22);stroke-width:3;stroke-linecap:round}
.bg-birth .bg-ch.on{stroke:#c9a35a;stroke-width:4.5}.bg-dharma .bg-ch.on{stroke:#9b84f0;stroke-width:4.5}
.bg-arrow{fill:#fff4d6;stroke:rgba(0,0,0,.35);stroke-width:.6}.bg-dharma .bg-arrow{fill:#efe8ff}
.bg-birth .bg-spark{fill:#f2d48a}.bg-dharma .bg-spark{fill:#d6c9ff}
.bg-c path{fill:none;stroke:rgba(156,180,166,.6);stroke-width:1.6}
.bg-birth .bg-c.on path{fill:#c9a35a;stroke:#e6c47e}.bg-dharma .bg-c.on path{fill:#9b84f0;stroke:#c2b2ff}
.bg-c text{fill:var(--ivory);font-size:10.5px;text-anchor:middle}.bg-c.on text{fill:#14101e;font-weight:600}
@media print{
  .rd-totop{display:none}
  :root{--void:#fff;--ivory:#1b1b1b;--dim:#666;--celadon:#2f5f50;--jade:#2f6f5a;--gold:#8a6a2a;--rule:#ddd}
  @page{margin:.65in .7in}
  body{font-size:10.5pt;line-height:1.5}.tools,.preview{display:none}.wrap{width:auto;padding:0}
  header h1{font-size:30pt}.opening,.closing{font-size:11pt}
  .rd-sec{padding-top:0;margin-top:22pt}.rd-sec h2{font-size:20pt}.rd-sec h3{font-size:13pt;margin:16pt 0 4pt;break-after:avoid}
  .rd-pair{font-size:10pt;padding:4pt 0;gap:10pt;break-inside:avoid}.rd-hdr,.rd-note,.rd-held{font-size:9.5pt}
  .rd-body h5,.rd-gifts h5,.rd-repair h5{font-size:10pt;margin:8pt 0 1pt}table{font-size:9.5pt}
  .bg-sparks{display:none}.bg-ch{stroke:#e2e2e2;stroke-width:2}.bg-c path{stroke:#888}.bg-c text{fill:#222}.bg-c.on text{fill:#fff}.bg-pair{break-inside:avoid}
  .rd-entry{margin:12pt 0}.rd-entry p,.rd-body p{margin:4pt 0}.rd-step{break-inside:avoid}
  .rd-ask{background:none}a{color:inherit}
}
</style>
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
</head>
<body>
<div class="preview">{{PREVIEW}}</div>
<div class="wrap">
<header>
  <h1>{{WHO}}</h1>
  <p class="born">{{BORN}}</p>
  <p class="opening">{{OPENING}}</p>
  <div class="tools">
    <button onclick="window.print()">Save as PDF</button>
    <button onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href).then(()=>this.textContent='Link copied')">Copy link to this reading</button>
  </div>
</header>
{{BODY}}
<p class="closing">{{CLOSING}}</p>
{{FOOTER}}
</div>
</body>
</html>
