# Every Monday morning: send each member their Body Weather, and you your summary.
# If the secrets are missing or the site answers with an error, the run fails, so GitHub emails you.
# Needs one repository secret (Settings → Secrets and variables → Actions):
#   JOBS_TOKEN  the same long random value as JOBS_TOKEN in Render
# SITE_URL is optional; without it the job calls https://wyrdconsole.com
name: Weekly Body Weather
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the site and run the weekly job
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://wyrdconsole.com' }}
          JOBS_TOKEN: ${{ secrets.JOBS_TOKEN }}
        run: |
          if [ -z "$JOBS_TOKEN" ]; then echo "::error::JOBS_TOKEN is not set in this repository's Actions secrets, so no Body Weather was sent."; exit 1; fi
          curl -fsS --retry 4 --retry-delay 20 --retry-all-errors -o /dev/null "$SITE_URL/healthz"
          out=$(curl -fsS --max-time 600 -X POST -H "Authorization: Bearer $JOBS_TOKEN" "$SITE_URL/jobs/weekly")
          echo "$out"
          if echo "$out" | grep -q '"error"'; then echo "::error::The weekly job answered with an error."; exit 1; fi
