services:
  - type: web
    name: wyrd-console
    runtime: python
    plan: free            # the free plan sleeps between visitors; don't sell on it
    buildCommand: pip install -r requirements.txt && python scripts/build_places.py && python scripts/warm.py
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BASE_URL
        sync: false          # e.g. https://chart.webofwyrd.com
      - key: STRIPE_SECRET_KEY
        sync: false          # sk_test_... first, then sk_live_...
      - key: STRIPE_PRICE_ID
        sync: false          # optional
      - key: CONSULT_PATH
        sync: false          # the secret part of the 1:1 page address: /c/<this>
      - key: CONSULTATION_PAYMENT_LINK_URL
        sync: false          # the buy.stripe.com link for 1:1 consultations
      - key: ADMIN_PASSWORD
        sync: false          # your private admin at /admin; use a long password
      - key: SECRET_KEY
        generateValue: true  # signs the admin login; Render makes one for you
      - key: GITHUB_TOKEN
        sync: false          # lets Pulse save its anonymous counts to the wyrd-data branch (Contents: read and write, this repo only)
      - key: SMTP_HOST
        sync: false          # email for sign-in links and Body Weather; for Gmail: smtp.gmail.com
      - key: SMTP_USER
        sync: false          # the sending address, e.g. your Gmail
      - key: SMTP_PASSWORD
        sync: false          # for Gmail: an app password (Google account → Security → App passwords)
      - key: MAIL_FROM
        sync: false          # optional: e.g. Saga Devi <you@gmail.com>
      - key: RESEND_API_KEY
        sync: false          # optional instead of SMTP, once you have your own domain
      - key: OWNER_EMAIL
        sync: false          # where your Monday summary goes
      - key: JOBS_TOKEN
        generateValue: true  # copy this into the GitHub secret JOBS_TOKEN for the weekly email
      - key: STRIPE_MEMBER_MONTHLY_PRICE
        sync: false          # price_... for Wyrd Membership monthly
      - key: STRIPE_MEMBER_YEARLY_PRICE
        sync: false          # price_... for Wyrd Membership yearly
      - key: STRIPE_PRO_MONTHLY_PRICE
        sync: false          # price_... for Wyrd Console Professional
